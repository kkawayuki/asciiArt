<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--link js file, add defer to prevent onload error-->
    <script src="img.js" defer></script>
</head>
<body>
    <h1>img ➜ ascii art generator</h1>

    <!--image input-->
    <label for="imageInput">Choose an image to upload:</label>
    <input type="file" id="imageInput" accept="image/*" />

    <!--width specifier-->
    <label for="widthInput">Output width (chars):</label>
    <input type="number" id="widthInput" min="20" max="300" value="100" />

    <!--canvas area to display output-->
    <canvas id = "canvas" style="border: 1px solid black;"></canvas>
</body>
</html>
