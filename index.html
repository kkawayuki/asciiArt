<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ascii art generator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="circle2.png">
    <script src="img.js" defer></script>
</head>
<body>
    <main class="layout">

        <section class="hero">
            <div class="hero-container">
                <h1>img ➜ ascii art generator</h1>
                <p>upload an image or pick a sample, then drag the slider to set the output width</p>
            </div>
        </section>

        <div class="workspace">
            <section id="input">
                <h2>input</h2>

                <div id="displayTable">
                    <div id="controls">
                        <!--image input-->
                        <div class="control">
                            <label for="imageInput">choose an image to upload</label>
                            <input type="file" id="imageInput" accept="image/*" />
                        </div>

                        <div class="control">
                            <label>samples</label>
                            <div id="samples">
                                <img src="images/madoka.jpg" alt="madoka">
                                <img src="images/sana.png" alt="sana">
                                <img src="images/smile.png" alt="pinterest">
                            </div>
                        </div>

                        <!--width specifier-->
                        <div class="control">
                            <label for="widthInput">output width (chars)</label>
                            <div class="width-row">
                                <input type="range" id="widthInput" min="20" max="300" value="100"/>
                                <input type="text" id="textInput" value="100" aria-label="output width">
                            </div>
                        </div>
                    </div>

                    <!--canvas area to display selected image, below the controls-->
                    <canvas id="canvas"></canvas>
                </div>
            </section>

            <section id="output">
                <h2>output</h2>

                <div id="asciiContainer">
                    <!--ASCII display -->
                    <pre id="asciiOutput"></pre>
                </div>
            </section>
        </div>

    </main>
</body>
</html>
