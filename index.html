<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">

    <!--link js file, add defer to prevent onload error-->
    <script src="img.js" defer></script>
</head>
<body>
    <h1>img ➜ ascii art generator</h1>

    <div id="displayTable">
    
        <div id="controls">
            <!--image input-->
            <label for="imageInput">Choose an image to upload:</label>
            <input type="file" id="imageInput" accept="image/*" />

            <!--width specifier-->
            <label for="widthInput">Output width (chars):</label>
            <input type="range" id="widthInput" min="20" max="300" value="100" onchange="updateTextInput(this.value);"/>
            <input type="text" id="textInput" value="">
        </div>

        <!--canvas area to display selected image-->
        <canvas id = "canvas"></canvas>
    </div>

    <!--ASCII display -->
    <pre id="asciiOutput"></pre>
    
</body>
</html>
